services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Внутри compose backend ходит в БД по hostname "db"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:8080"   # backend доступен на localhost:3001 (для отладки)
    # Прогоняем миграции, затем запускаем сервер
    command: sh -c "node dist/db/migrate.js && node dist/index.js"

  frontend:
    build:
      context: ./frontend
      args:
        # Во время сборки фронта /api проксируется nginx на backend,
        # поэтому базовый URL API — относительный "/api".
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"     # Mini App открывается на http://localhost:8080

volumes:
  pgdata:
